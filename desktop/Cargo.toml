[package]
name = "opencom-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "opencom desktop app (Tauri shell around the opencom server)"

[[bin]]
name = "opencom-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opencom = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
